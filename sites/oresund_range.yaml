# Øresund Test Range — offshore airframe validation, middle of the strait
# Wire contract: docs/integration-contracts.md Section 3 "Site definition"
#
# NOT A CUSTOMER SITE. This exists so an airframe can be flown and judged
# over open water, with no photogrammetry to render and nothing in frame
# but sea. Distances from the centre to the nearest thing that renders:
#
#   Øresund Bridge      3.9 km
#   Peberholm           4.2 km
#   Saltholm            5.5 km
#   Malmö coast         5.7 km
#   Amager coast       11.3 km
#
# It carries sensors because a drone is only drawn inside sensor
# coverage, which is deliberate and not negotiable. Four nodes in a 250 m
# diamond put the whole showcase box within 310 m of one. Coverage is
# evaluated across every site in SITES, not only the rendered ones, so
# the range makes the airspace observable without drawing its own markers
# into a customer's view.
#
# Its tenant is ISR's own, so it does not appear in any operator's site
# list and no customer sees a test range in their fleet.

site_id: oresund_range
label: Øresund Test Range
code: ORT
subtitle: Offshore airframe validation range
tenant: op-isr-internal
site_type: other
mode: sim
coordinates:
  lat: 55.60500
  lon: 12.86000

domain_scope:
  - maritime
  - aviation

# A box around the range. Nothing here is a real perimeter; it is open
# water, and the boundary exists because the schema requires one.
boundary:
  - [12.8515718, 55.5977955]
  - [12.8738350, 55.5977955]
  - [12.8738350, 55.6103719]
  - [12.8515718, 55.6103719]

sensors:
  - { sensor_id: ORT-N01, label: "Range Node 01 (N)",    position: { lat: 55.60633, lon: 12.86270 }, coverage_radius_m: 1000, modalities: [RF, Acoustic, Visual], status: online, hardware: "Radxa Rock 4SE",          detectionsLast24h: 0, issues: null }
  - { sensor_id: ORT-N02, label: "Range Node 02 (E)",    position: { lat: 55.60408, lon: 12.86668 }, coverage_radius_m: 1000, modalities: [RF, Acoustic, Visual], status: online, hardware: "Radxa Rock 4SE",          detectionsLast24h: 0, issues: null }
  - { sensor_id: ORT-N03, label: "Range Node 03 (S)",    position: { lat: 55.60184, lon: 12.86270 }, coverage_radius_m: 1000, modalities: [RF, Acoustic, Visual], status: online, hardware: "Radxa Rock 4SE",          detectionsLast24h: 0, issues: null }
  - { sensor_id: ORT-N04, label: "Range Node 04 (Core)", position: { lat: 55.60408, lon: 12.85873 }, coverage_radius_m: 1000, modalities: [RF, Acoustic, Visual], status: online, hardware: "Radxa Rock 4SE + HackRF", detectionsLast24h: 0, issues: null, isCore: true }

sensorsOnline: 4
