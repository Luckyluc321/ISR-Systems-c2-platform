# Esbjerg falls within Syd- og Sønderjyllands Politi, whose hovedstation
# IS Esbjerg (politi.dk). A previous comment here claimed a "Politi
# Sydvestjylland" district covering Esbjerg. No such politikreds exists.
receivers:
  # Actors (maritime + industrial)
  - { id: politi-sydsonderjyl,    mode: actor,    role: primary-response,    tier: 1 }
  - { id: brs-haderslev,          mode: actor,    role: emergency-response,  tier: 2 }
  - { id: sov-frederikshavn,      mode: actor,    role: maritime-response,   tier: 3 }
  - { id: agency-sof,             mode: actor,    role: regulator,           tier: 3 }
  - { id: kom-esbjerg,            mode: actor,    role: municipal-crisis,    tier: 4 }
  # Observers (in the loop, no CTAs)
  - { id: rigspoliti,             mode: observer }
  - { id: pet,                    mode: observer }
  - { id: forsvaret,              mode: observer }
  - { id: fe,                     mode: observer }
  - { id: min-just,               mode: observer }
  - { id: min-fors,               mode: observer }
  # Conditional observers (auto-added only on matching condition)
  - { id: region-syd,             mode: observer, condition: casualty-scenario }
  - { id: brs-kemisk,             mode: observer, condition: cbrn-threat }
