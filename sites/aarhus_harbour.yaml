# Aarhus Harbour site manifest
# Wire contract: docs/integration-contracts.md Section 3 "Site definition"
# Flow doc:      docs/sites/aarhus-harbour.md
#
# Built 2026-10-22 for the promo trailer, alongside CPH. Denmark's largest
# container port, with the ferry terminal, the oil terminal and the inner
# city quays inside one boundary.

site_id: aarhus_harbour
label: Aarhus Harbour
code: AAR
tenant: op-aarhus-port
site_type: port
# SIMULATED, like every shipped site. See cph.yaml for why this field
# exists at all.
mode: sim
coordinates:
  lat: 56.1508
  lon: 10.2284

domain_scope:
  - maritime
  - ground

# Traced by Lucas on 2026-10-22 inside the platform (shift-click tracer,
# src/photoreal_coverage.js), in three passes: the outer loop, then the
# inner edge of the northern basin, then the indentation at the city
# quay. 273 vertices after an 8 m simplification, 3.48 km2, no
# self-intersections (checked). The south edge crosses the harbour
# entrance over water, from the south quay to the container pier, which
# is normal for a port boundary. Where the northern basin meets the city
# quay, a 20 m strip of water along 600 m of quay is narrowed to a 4 m
# corridor so the two edges never cross; no sensor is placed within
# 25 m of it.
