# 17 sensors, computed against the THREE-EYE policy (same as
# odense.yaml and cph.yaml): every point inside the boundary is within
# 1000 m of at least three nodes. Greedy set cover over a 17 m sample
# grid (12,096 points), candidates on a 25 m grid INSIDE THE BOUNDARY
# only and at least 25 m from its edge, 500 m MINIMUM SEPARATION (solved
# at 505 m so the platform's own spherical distance also reads 500+).
# Result: 100% of the site at three or more eyes. Solver:
# scripts/three-eye-solver.py. Ids carry the site prefix, as Billund's
# BLL- do: bare N01-N16 collided with CPH's N-ids, and the incident report
# looks a sensor up by id across every site.
#
# Labels follow the four zones of the 2026-04 deployment plan for the
# port. That plan has 105 nodes for a denser, multi-modality build; this
# is the three-eye minimum. Positions are computed, not surveyed: some
# may land on a crane rail or a roof edge, and each needs an eye before
# hardware is ordered.
sensors:
  - { sensor_id: AAR-N01, label: "Quay Front Upper 1", position: { lat: 56.16909, lon: 10.22309 }, coverage_radius_m: 1000, modalities: [RF, Acoustic, Visual], status: online, hardware: "Radxa Rock 4SE", detectionsLast24h: 0, issues: null }
  - { sensor_id: AAR-N02, label: "Quay Front Upper 2", position: { lat: 56.16505, lon: 10.21906 }, coverage_radius_m: 1000, modalities: [RF, Acoustic, Visual], status: online, hardware: "Radxa Rock 4SE", detectionsLast24h: 0, issues: null }
