# Aarhus is Østjyllands Politi (hovedstation Ridderstræde 1, Aarhus C,
# already in receiver_bases.js). Beredskabsstyrelsen Midtjylland sits in
# Herning. Maritime response mirrors Esbjerg.
receivers:
  # Actors (maritime + industrial)
  - { id: politi-ostjyl,          mode: actor,    role: primary-response,    tier: 1 }
  - { id: brs-herning,            mode: actor,    role: emergency-response,  tier: 2 }
  - { id: sov-frederikshavn,      mode: actor,    role: maritime-response,   tier: 3 }
  - { id: agency-sof,             mode: actor,    role: regulator,           tier: 3 }
  - { id: kom-aarhus,             mode: actor,    role: municipal-crisis,    tier: 4 }
  # Observers (in the loop, no CTAs)
  - { id: rigspoliti,             mode: observer }
  - { id: pet,                    mode: observer }
  - { id: forsvaret,              mode: observer }
  - { id: fe,                     mode: observer }
  - { id: min-just,               mode: observer }
  - { id: min-fors,               mode: observer }
  # Conditional observers (auto-added only on matching condition)
  - { id: region-midt,            mode: observer, condition: casualty-scenario }
  - { id: brs-kemisk,             mode: observer, condition: cbrn-threat }
