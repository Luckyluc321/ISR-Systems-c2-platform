# 22-sensor mesh: 6 OSM-verified rooftop anchors + 16 hex-grid fill.
# Coverage radius 1000m, hex spacing 800m → 95.4% min-2 coverage across
# the real 10.44 km² aerodrome polygon (not the earlier convex hull).
# Hex-fill sensors mounted on nearest airside infrastructure (poles,
# ILS cabinets, fire towers, perimeter towers).
