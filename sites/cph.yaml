# Copenhagen Airport (CPH / EKCH) site manifest
# Wire contract: docs/integration-contracts.md Section 3 "Site definition"
# Flow doc:      docs/sites/cph-airport.md

site_id: cph
label: Copenhagen Airport
code: CPH
tenant: op-cph-airports
site_type: airport
# Environment this manifest describes. Every shipped site is
# SIMULATED: positions come from scenario templates, not from a
# sensor feed. This said "live" on all nine sites while nothing
# read the field, so the first code to read it would have flipped
# the whole fleet at once.
mode: sim
coordinates:
  lat: 55.618
  lon: 12.647

domain_scope:
  - aviation
  - ground

# Real CPH aerodrome polygon, traced against imagery in October 2026 and
# cleaned, replacing the 74-vertex OSM simplification that cut across the
# airfield in several places and reached into open fields in others.
#
# 159 points were traced, in order. 12 were dropped as misfires, found by
# asking whether removing a point SHORTENS the outline: a stray detours
# out and back, a real corner does not. That took the perimeter from
# 25.22 to 21.90 km while the enclosed area held, which is what removing
# noise looks like rather than removing detail.
#
# Two stretches were then retraced by hand where the line cut across
# ground it should follow, including the voldgrav edge on the north side,
# and spliced in by anchoring each run to its nearest existing vertex.
#
# 162 vertices, 21.00 km perimeter, 10.93 km² enclosed, against the
# 10.44 km² the aerodrome actually covers.
