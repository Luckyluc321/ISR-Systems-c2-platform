# 19 sensors — DUAL COVERAGE layout: every point inside the aerodrome
# polygon is within 1000m of at least TWO sensors. Layout: 3 rows
# (south perimeter / centreline / north perimeter) × 5 columns spanning
# main body + 2 columns covering east protrusion. Core node (HackRF)
# sits at centreline hub near passenger terminal + runway midpoint.
#
# Each sensor here uses the extended sensor shape — modality omitted
# because these are multi-modality Radxa nodes carrying `modalities`
# array (legacy shape passthrough). Loader normalises modality to
# `modalities[0]` when the single-modality field is absent.
sensors:
  # Row 1 — South perimeter (aprons + terminal + cargo)
  - sensor_id: BLL-N01
    label: SW perimeter
    position: { lat: 55.73600, lon: 9.13000 }
    coverage_radius_m: 1000
    modalities: [RF, Acoustic, Visual]
    status: online
    hardware: Radxa Rock 4SE
    detectionsLast24h: 1
  - sensor_id: BLL-N02
    label: S apron (W terminal side)
    position: { lat: 55.73620, lon: 9.14000 }
    coverage_radius_m: 1000
    modalities: [RF, Acoustic, Visual]
    status: online
    hardware: Radxa Rock 4SE
    detectionsLast24h: 3
  - sensor_id: BLL-N03
