# Sydøstjyllands Politi covers Billund Kommune per politi.dk.
# Trekantområdets Brandvæsen (TrekantBrand) is the municipal fire
# service. brs-haderslev is the nearest national BRS unit for Tier-2
# escalation. Karup is the nearest Flyvevåbnet base for air response
# (~90km NW). HJV Vest covers Syd- og Sønderjylland.
receivers:
  # Actors
  - { id: politi-sydostjyl,        mode: actor,    role: primary-response,   tier: 1 }
  - { id: brs-haderslev,           mode: actor,    role: emergency-response, tier: 2 }
  - { id: flv-karup,               mode: actor,    role: air-response,       tier: 3 }
  - { id: agency-traf,             mode: actor,    role: regulator,          tier: 4 }
  - { id: kom-billund,             mode: actor,    role: municipal-crisis,   tier: 4 }
  # Observers
  - { id: rigspoliti,              mode: observer }
  - { id: pet,                     mode: observer }
  - { id: forsvaret,               mode: observer }
  - { id: fe,                      mode: observer }
  - { id: agency-cfcs,             mode: observer }
  - { id: min-just,                mode: observer }
  - { id: min-erhverv,             mode: observer }
  # Conditional observers
  - { id: region-syd,              mode: observer, condition: casualty-scenario }
  - { id: brs-kemisk,              mode: observer, condition: cbrn-threat }
  - { id: brs-nukleart,            mode: observer, condition: nuclear-threat }
  - { id: hjv-vest,                mode: observer, condition: sustained-incident }

# Default cascade recipients per common event shape. Feeds the
# Mission Console picker's recommendation row for this site.
default_cascade_recipients:
  hostile_any:
    - pet
    - fe
    - politi-sydostjyl
  hostile_high:
    - forsvarskmd
    - rigspoliti
    - beredskab
    - agency-traf
  cruise_missile:
    - flv-karup
    - flv-skrydstrup
  legoland_proximity:
    - kom-billund

always_observers:
  - agency-traf

escalation_sla_minutes:
  hostile_high: 4
  legoland_proximity: 5
  charter_departure_hostile: 3

regulatory_context: |
  Class D controlled airspace up to 4500 ft AGL. Coordination with ATC on
  118.500 MHz (Tower), 121.850 MHz (Ground). NOTAM authority: Trafikstyrelsen.
  Single-runway operations mean NOTAM decisions are heavier than at CPH —
  restriction affects all operations. Operator + Trafikstyrelsen coordinate
  duration explicitly. LEGOLAND proximity (2km SW) elevates public-safety
  concern for low-altitude events; kom-billund gets cascaded on any event
  within 2km of park boundary.

flow_doc: docs/sites/billund-airport.md
