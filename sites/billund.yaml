# Billund Airport (EKBI) site manifest
# Wire contract: docs/integration-contracts.md Section 3 "Site definition"
# Flow doc:      docs/sites/billund-airport.md
#
# This is the FIRST manifest migrated from the inline src/sites.js seed.
# Purpose: validate the site loader end-to-end with a real site's data.
# Once the loader is verified, remaining sites (CPH, Esbjerg, Energinet)
# follow the same pattern.

site_id: billund
label: Billund Airport
code: BLL
tenant: op-billund-airport
site_type: airport
# Environment this manifest describes. Every shipped site is
# SIMULATED: positions come from scenario templates, not from a
# sensor feed. This said "live" on all nine sites while nothing
# read the field, so the first code to read it would have flipped
# the whole fleet at once.
mode: sim
coordinates:
  lat: 55.740511
  lon: 9.158056

