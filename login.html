<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TIGER · ISR Systems</title>
<link rel="icon" href="/isr-logo.png" />
<style>
  /* ═══════════════════════════════════════════════════════════════
     THE BRAND IS isr-systems.com, NOT AN INVENTION.
     ───────────────────────────────────────────────────────────────
     Every value below is lifted from the live site: pure black, white
     at 0.45/0.5 for secondary text, the two font stacks, 0.28em on the
     tagline, 0.14em on the corner labels, the 1px x 12px rules beside
     them, and the staggered rise/fade.

     What the site does NOT have, and so neither does this: a card, a
     border box, a panel, a background animation, an accent colour.
     The first version of this page had a bordered card and a radar
     sweep, which is why it read as generic. The brand is severe and
     empty on purpose.
     ═══════════════════════════════════════════════════════════════ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; width: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Inter", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
  }

  .container {
    min-height: 100vh;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 2rem;
    position: relative;
  }

  /* ── Corner labels, verbatim from the site ───────────────────── */
  .location, .corner-right {
    position: fixed; top: 1.75rem;
    display: inline-flex; align-items: center; gap: 0.85rem;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 0.68rem; font-weight: 400;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 0.14em; text-transform: uppercase;
    text-decoration: none;
    opacity: 0; animation: fade 1.2s ease forwards 1s;
  }
  .location { left: 2rem; }
  .corner-right { right: 2rem; }
  .location::before, .corner-right::after {
    content: ''; display: inline-block;
    width: 1px; height: 12px;
    background: rgba(255, 255, 255, 0.35);
    transition: background 0.3s ease;
  }
  .corner-right:hover, .corner-right:focus-visible {
    color: rgba(255, 255, 255, 0.95); outline: none;
  }
  .corner-right:hover::after, .corner-right:focus-visible::after {
    background: rgba(255, 255, 255, 0.95);
  }

  /* ── Lockup ──────────────────────────────────────────────────── */
  .logo {
    max-width: min(44vw, 360px); width: 100%; height: auto;
    opacity: 0; transform: translateY(8px);
    animation: rise 1.2s ease forwards 0.2s;
  }
  /* THE PRODUCT NAME AS A DESIGNATION, NOT A SECOND WORDMARK.
     The logo already contains "ISR SYSTEMS" set in wide-tracked caps.
     Setting TIGER the same way below it produced two wordmarks in the
     same treatment, competing, with the lower one reading as a mistake.
     Scale alone would not have separated them.
     So it borrows the one motif the brand already owns: the 1px x 12px
     rule that flanks the corner labels. Small, flanked, dim. That reads
     as a designation stamped under a mark, which is what it is. The
     "Site Intelligence Platform" line went entirely: the company site
     carries one line of copy, and this page does not need two. */
  .product {
    margin-top: 2.1rem;
    display: inline-flex; align-items: center; gap: 0.85rem;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 0.68rem; font-weight: 400;
    letter-spacing: 0.34em; text-indent: 0.34em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.5);
    opacity: 0; transform: translateY(8px);
    animation: rise 1.2s ease forwards 0.6s;
  }
  .product::before, .product::after {
    content: ''; display: inline-block;
    width: 1px; height: 12px;
    background: rgba(255, 255, 255, 0.35);
  }
  .product::after { margin-left: -0.34em; }

  form {
    width: 100%; max-width: 332px;
    margin-top: 4.2rem;
    opacity: 0; transform: translateY(8px);
    animation: rise 1.2s ease forwards 0.9s;
  }
  .field { margin-bottom: 1.9rem; }
  label {
    display: block;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(255, 255, 255, 0.45);
    margin-bottom: 0.7rem;
  }
  input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.26);
    border-radius: 0;
    padding: 0 0 0.6rem;
    color: #fff;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 0.86rem; letter-spacing: 0.04em;
    outline: none;
    transition: border-color 0.3s ease;
  }
  /* NO PLACEHOLDERS. A greyed "name@organisation.dk" and a row of bullet
     glyphs are the two details that make a sign-in read as a template.
     The labels already say what each field is, and an empty field looks
     deliberate where a faint example looks unfinished. */
  input:focus { border-bottom-color: rgba(255, 255, 255, 0.95); }
  input:-webkit-autofill {
    -webkit-text-fill-color: #fff;
    transition: background-color 9999s ease-out;
  }

  button[type="submit"] {
    width: 100%;
    margin-top: 2.6rem;
    padding: 0.95rem 1rem;
    background: transparent;
    color: rgba(255, 255, 255, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 0;
    cursor: pointer;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase;
    transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
  }
  button[type="submit"]:hover,
  button[type="submit"]:focus-visible {
    background: rgba(255, 255, 255, 0.95);
    border-color: rgba(255, 255, 255, 0.95);
    color: #000;
    outline: none;
  }
  button[type="submit"]:disabled {
    opacity: 0.35; cursor: default;
    background: transparent; color: rgba(255, 255, 255, 0.95);
    border-color: rgba(255, 255, 255, 0.35);
  }

  .err {
    min-height: 1rem;
    margin-top: 1.1rem;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: rgba(255, 255, 255, 0.95);
    text-align: center;
  }

  .foot {
    position: fixed; bottom: 1.75rem; left: 0; right: 0;
    text-align: center;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(255, 255, 255, 0.28);
    opacity: 0; animation: fade 1.2s ease forwards 1.3s;
  }

  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  @keyframes fade { to { opacity: 1; } }

  @media (max-width: 600px) {
    .logo { max-width: 68vw; }
    .location { top: 1.25rem; left: 1.25rem; font-size: 0.7rem; }
    .corner-right { top: 1.25rem; right: 1.25rem; font-size: 0.7rem; }
    form { margin-top: 3rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .logo, .product, form, .location, .corner-right, .foot {
      animation: none; opacity: 1; transform: none;
    }
  }
</style>
</head>
<body>

<span class="location">Copenhagen, Denmark</span>
<a class="corner-right" href="mailto:contact@isr-systems.com">Contact</a>

<div class="container">
  <img src="/isr-logo.png" alt="ISR Systems" class="logo" />
  <p class="product">Tiger</p>

  <form id="form" autocomplete="on">
    <div class="field">
      <label for="email">Operator ID</label>
      <input id="email" name="email" type="email"
             autocomplete="username" required />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required />
    </div>
    <button type="submit" id="submit">Sign in</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</div>

<p class="foot">Authorised access only</p>

<script type="module">
// ═══════════════════════════════════════════════════════════════════
// THE AUTH SEAM. One function, deliberately.
// ───────────────────────────────────────────────────────────────────
// Nothing here verifies anything. The platform's identity surface is
// already a single point: roles.js keeps _activeId private and
// setActiveRole() is the only thing that writes it. So a real provider
// replaces the body of authenticate() and nothing else in the app
// moves.
//
// When the Azure tenant is fixed, authenticate() becomes a token
// exchange: the provider returns claims, the claims map to an account
// id, and the id is handed on exactly as below. That mapping belongs
// server side.
// ═══════════════════════════════════════════════════════════════════

const ACCOUNT_KEY = 'isr.auth.accountId';

async function authenticate(email, _password) {
  const id = String(email || '').trim().toLowerCase();
  if (!id) return { ok: false, reason: 'Operator ID required' };

  // Local resolution only, so the operator flow can be walked as a real
  // operator rather than as admin. Replaced wholesale by the provider.
  const byDomain = [
    [/@cph|kobenhavn|københavn|kastrup/, 'op-cph-airports'],
    [/@bll|billund/,                     'op-billund-airport'],
    [/@ode|odense/,                      'op-odense-airport'],
    [/@esb|esbjerg/,                     'op-esbjerg-port'],
    [/@energinet/,                       'op-energinet'],
  ];
  for (const [re, accountId] of byDomain) if (re.test(id)) return { ok: true, accountId };
  return { ok: true, accountId: 'admin-isr' };
}

const form = document.getElementById('form');
const errEl = document.getElementById('err');
const submit = document.getElementById('submit');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errEl.textContent = '';
  submit.disabled = true;
  submit.textContent = 'Authenticating';
  try {
    const res = await authenticate(
      document.getElementById('email').value,
      document.getElementById('password').value,
    );
    if (!res.ok) { errEl.textContent = res.reason; return; }
    // Session storage, not local: closing the tab ends the session,
    // which is the right default for an operations console even before
    // it is enforced.
    try { sessionStorage.setItem(ACCOUNT_KEY, res.accountId); } catch (_) { /* private mode */ }
    window.location.href = '/';
  } catch (err) {
    errEl.textContent = 'Sign-in failed';
    console.error('[login]', err);
  } finally {
    submit.disabled = false;
    submit.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
