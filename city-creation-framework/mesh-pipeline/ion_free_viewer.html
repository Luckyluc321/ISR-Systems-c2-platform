<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mesh Check</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.115.0/Cesium.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.115.0/Widgets/widgets.css">
<style>
  :root { --bg: #0b0f14; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b0f14; } }
  :root[data-theme="dark"] { --bg: #0b0f14; }
  html, body, #c { margin: 0; width: 100%; height: 100%; background: var(--bg); }
</style>
</head>
<body>
<div id="c"></div>
<script>
// ION-FREE VIEWER: no token, no ion assets, no imagery, no terrain.
// Loads ONLY the local tileset served next to this file. Zero sessions.
Cesium.Ion.defaultAccessToken = undefined;
const viewer = new Cesium.Viewer('c', {
  imageryProvider: false, baseLayerPicker: false, geocoder: false,
  animation: false, timeline: false, sceneModePicker: false,
  navigationHelpButton: false, homeButton: false, fullscreenButton: false,
  infoBox: false, selectionIndicator: false,
  contextOptions: { webgl: { failIfMajorPerformanceCaveat: false } },
});
viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString('#1a2520');
viewer.scene.skyBox && (viewer.scene.skyBox.show = false);
viewer.scene.skyAtmosphere && (viewer.scene.skyAtmosphere.show = false);
window.__ready = false;
(async () => {
  const ts = await Cesium.Cesium3DTileset.fromUrl('tileset.json', { maximumScreenSpaceError: 4 });
  viewer.scene.primitives.add(ts);
  const params = new URLSearchParams(location.search);
  const mode = params.get('view') || 'oblique';
  const bs = ts.boundingSphere;
  const offsets = {
    top:     new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-89), bs.radius * 2.2),
    oblique: new Cesium.HeadingPitchRange(Cesium.Math.toRadians(30), Cesium.Math.toRadians(-30), bs.radius * 1.6),
    ground:  new Cesium.HeadingPitchRange(Cesium.Math.toRadians(300), Cesium.Math.toRadians(-14), bs.radius * 1.25),
  };
  await viewer.zoomTo(ts, offsets[mode] || offsets.oblique);
  const check = () => {
    if (ts.tilesLoaded) { window.__ready = true; }
    else setTimeout(check, 500);
  };
  check();
})();
</script>
</body>
</html>
